# ort.toml – Steckbrief von St. Ingbert für den Saar LiDAR Explorer (Format sle-ort-v1).
# Die Pipeline des Explorers liest diese Datei bei jedem Build (pipeline/place.py); `werkzeuge/ort_check.py`
# prüft sie schon im Pull Request (Schema: werkzeuge/schemas/ort.schema.json). Unbekannte Schlüssel sind Fehler.

schema = "sle-ort-v1"
id = "st-ingbert"
name_de = "St. Ingbert"
ags = "10045117"   # Mittelstadt St. Ingbert, Saarpfalz-Kreis (Stadtteile Mitte, Rohrbach, Hassel, Oberwürzbach, Rentrisch; 49,9 km²)
state = "SL"
# Vorläufig: noch keine Ortspatin / kein Ortspate – bis dahin betreut der Explorer-Maintainer den Ort.
maintainers = ["huhn511"]

[options]
# Relikt-Kandidaten: aus (Standard für neue Orte, ADR 0053). Erst einschalten, wenn eine Ortspatin oder ein
# Ortspate die Kandidaten angesehen hat und die Denkmalsituation kennt (SDschG Saarland).
relict_candidates = false
# Punktwolken nur für ausgewählte Schwerpunkte (≈ 40 MB je km²). Noch keine – eigene Flächen können unten als
# [[pointcloud_area]] dazukommen (Rechteck in EPSG:25832, Vielfache von 100 m, höchstens 1 km², höchstens 5).
pointclouds = []
